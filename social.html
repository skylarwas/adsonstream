<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdsOnStream — Socials</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0C0C;
    --surface: #141414;
    --border: rgba(255,255,255,0.07);
    --text: #F0EDE8;
    --muted: rgba(240,237,232,0.4);
    --red: #E8342A;
    --twitch: #9147FF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 420px;
  }

  .logo {
    text-align: center;
    margin-bottom: 8px;
  }

  .logo-text {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .logo-text span { color: var(--red); }

  .tagline {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 48px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .link-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent, var(--red));
    transform: scaleY(0);
    transition: transform 0.2s;
  }

  .link-item:hover {
    border-color: var(--accent, var(--red));
    transform: translateX(4px);
  }

  .link-item:hover::before {
    transform: scaleY(1);
  }

  .link-icon {
    width: 36px;
    height: 36px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.04);
  }

  .link-info { flex: 1; }

  .link-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }

  .link-sub {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .link-arrow {
    font-size: 16px;
    color: var(--muted);
    transition: color 0.2s, transform 0.2s;
  }

  .link-item:hover .link-arrow {
    color: var(--text);
    transform: translateX(3px);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 8px 0;
  }

  footer {
    margin-top: 48px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  footer a:hover { color: var(--text); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-text">Ads<span>On</span>Stream</div>
  </div>
  <div class="tagline">Find us everywhere</div>

  <div class="links">

    <!-- AdsOnStream Twitch -->
    <a href="https://twitch.tv/adsonstream" target="_blank" class="link-item" style="--accent: var(--twitch);">
      <div class="link-icon">📺</div>
      <div class="link-info">
        <div class="link-title">Twitch — AdsOnStream</div>
        <div class="link-sub">twitch.tv/adsonstream</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

    <!-- theskyw Twitch -->
    <a href="https://twitch.tv/theskyw" target="_blank" class="link-item" style="--accent: var(--twitch);">
      <div class="link-icon">🎮</div>
      <div class="link-info">
        <div class="link-title">Twitch — theskyw</div>
        <div class="link-sub">twitch.tv/theskyw</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

    <div class="divider"></div>

    <!-- Twitter -->
    <a href="https://twitter.com/AdsOnStream" target="_blank" class="link-item" style="--accent: #1DA1F2;">
      <div class="link-icon">𝕏</div>
      <div class="link-info">
        <div class="link-title">Twitter / X</div>
        <div class="link-sub">@AdsOnStream</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

    <div class="divider"></div>

    <!-- Website -->
    <a href="https://adsonstream.xyz" target="_blank" class="link-item" style="--accent: var(--red);">
      <div class="link-icon">🌐</div>
      <div class="link-info">
        <div class="link-title">Website</div>
        <div class="link-sub">adsonstream.xyz</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

  </div>
</div>

<footer>
  © 2026 AdsOnStream · <a href="https://adsonstream.xyz">Submit a free ad</a>
</footer>

</body>
</html>
