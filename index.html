<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdsOnStream</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0d0d0d;
    color: #eaeaea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  p {
    font-size: 1.25rem;
    max-width: 500px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  a.btn {
    display: inline-block;
    padding: 12px 28px;
    background: #9146FF;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    border-radius: 8px;
    font-size: 1rem;
    transition: background 0.2s ease;
  }
  a.btn:hover {
    background: #7c2eff;
  }
</style>
</head>
<body>
  <div class="container">
    <p>lost the code and budget so this project is shutdown for good :(</p>
    <a class="btn" href="https://www.twitch.tv/theskyw" target="_blank" rel="noopener noreferrer">Watch me on Twitch</a>
  </div>

</html>
